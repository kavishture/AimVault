<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosshair details — AimVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115; --surface:#171A21; --surface-2:#1D212B; --line:rgba(245,243,238,0.09);
    --accent:#FF4655; --mint:#5DD6B3; --text:#F5F3EE; --muted:#8B90A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3, .brand{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; max-width:100%; }
  .wrap{ max-width:920px; margin:0 auto; padding:0 24px; }

  header{ background:var(--surface); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:14px 24px; max-width:1240px; margin:0 auto; }
  .brand-block{ display:flex; align-items:center; gap:12px; }
  .logo-mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg, var(--accent), #ff8a94); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand{ font-weight:700; font-size:17px; letter-spacing:-0.01em; line-height:1.15; }
  .brand-sub{ font-size:11px; color:var(--muted); letter-spacing:0.03em; }
  .back-link{ font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .back-link:hover{ color:var(--text); }

  .content{ padding:40px 24px 80px; }
  .detail-card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:grid; grid-template-columns:280px 1fr; }
  @media (max-width:680px){ .detail-card{ grid-template-columns:1fr; } }

  .preview{
    aspect-ratio:1/1; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, #3a352c, #26241f 55%, #1c1b18);
    display:flex; align-items:center; justify-content:center;
  }

  .info{ padding:32px; display:flex; flex-direction:column; gap:18px; }
  .type-tag{ align-self:flex-start; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:6px; background:rgba(255,70,85,0.12); color:var(--accent); }
  .info h1{ font-size:28px; letter-spacing:-0.01em; }
  .info .sub{ color:var(--muted); font-size:14.5px; margin-top:-8px; }

  .code-block{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .code-block code{ font-family:'JetBrains Mono', monospace; font-size:13.5px; word-break:break-all; color:var(--mint); }
  .copy-btn{ flex-shrink:0; background:var(--accent); color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; padding:9px 14px; border-radius:8px; border:none; cursor:pointer; }
  .copy-btn:hover{ filter:brightness(1.1); }
  .copy-btn.copied{ background:var(--mint); color:#0F1115; }

  .actions{ display:flex; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .btn-secondary{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--text); cursor:pointer; background:transparent; }
  .btn-secondary:hover{ border-color:var(--mint); color:var(--mint); }
  .btn-danger{ padding:9px 14px; border-radius:8px; border:1px solid rgba(255,70,85,0.3); font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; background:transparent; }
  .btn-danger:hover{ background:rgba(255,70,85,0.1); }

  .owner-note{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--mint); border-left:2px solid var(--mint); padding-left:10px; line-height:1.6; }

  .not-found{ text-align:center; padding:80px 20px; color:var(--muted); }
  .not-found a{ color:var(--accent); }

  footer{ border-top:1px solid var(--line); padding:28px 24px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.8; }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <div class="brand-block">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" width="18" height="18"><path d="M12 2v20M2 12h20"/></svg></div>
      <div>
        <div class="brand">AimVault</div>
        <div class="brand-sub">Valorant Crosshairs</div>
      </div>
    </div>
    <a class="back-link" href="index.html">← Back to all crosshairs</a>
  </div>
</header>

<div class="content wrap" id="content">
  <!-- populated by script -->
</div>

<footer>
  Codes are shared as-is — always double check in-game before competing.
</footer>

<script src="data.js"></script>
<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function render(){
  const id = getParam("id");
  const c = id ? getCrosshairById(id) : null;
  const content = document.getElementById("content");

  if(!c){
    content.innerHTML = `
      <div class="not-found">
        <h2>Crosshair not found</h2>
        <p style="margin-top:10px;">It may have been removed, or the link is off. <a href="index.html">Browse all crosshairs</a> instead.</p>
      </div>`;
    return;
  }

  document.title = c.name + " — AimVault";

  content.innerHTML = `
    <div class="detail-card">
      <div class="preview">${renderThumb(c, 280)}</div>
      <div class="info">
        <span class="type-tag">${c.type}</span>
        <h1>${c.name}</h1>
        ${c.team || c.role ? `<div class="sub">${c.team || c.role}</div>` : ""}

        <div class="code-block">
          <code id="codeText">${c.code || "No code provided"}</code>
          <button class="copy-btn" id="copyBtn">Copy code</button>
        </div>

        ${c.notes ? `<p style="color:var(--muted); font-size:14px; line-height:1.6;">${c.notes}</p>` : ""}

        ${c.custom ? `
          <div class="owner-note">This code was added on this device — you can edit or remove it any time.</div>
          <div class="actions">
            <button class="btn-secondary" id="editBtn">Edit</button>
            <button class="btn-danger" id="deleteBtn">Delete</button>
          </div>
        ` : ""}
      </div>
    </div>
  `;

  const copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(c.code || "");
      copyBtn.textContent = "Copied!";
      copyBtn.classList.add("copied");
      setTimeout(() => { copyBtn.textContent = "Copy code"; copyBtn.classList.remove("copied"); }, 1600);
    }catch(e){
      copyBtn.textContent = "Couldn't copy";
    }
  });

  if(c.custom){
    document.getElementById("editBtn").addEventListener("click", () => {
      window.location.href = "add.html?edit=" + encodeURIComponent(c.id);
    });
    document.getElementById("deleteBtn").addEventListener("click", () => {
      if(confirm(`Delete "${c.name}"? This can't be undone.`)){
        deleteCrosshair(c.id);
        window.location.href = "index.html";
      }
    });
  }
}

render();
</script>

</body>
</html>
