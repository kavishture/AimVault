const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

const seed=[

{id:"demo2",name:"Simple Cyan",creator:"ShadowAim",code:"0;P;c;4;o;1;0t;1;0l;2;0o;0;0a;1;0f;0;1b;0",type:"community",copies:16,created_at:new Date(Date.now()-3600000).toISOString()},
{id:"demo3",name:"Insane Cross",creator:"AimKing",code:"0;P;c;1;o;1;0t;2;0l;5;0o;2;0a;1;0f;0;1b;0",type:"community",copies:9,created_at:new Date(Date.now()-7200000).toISOString()}
];
const palette={
  0:"#FFFFFF", 1:"#00FF00", 2:"#7FFF00", 3:"#DFFF00",
  4:"#FFFF00", 5:"#00FFFF", 6:"#FF00FF", 7:"#FF0000"
};

/* ==========================================================================
   VALORANT CROSSHAIR ENGINE
   CODE -> parseValorantCode() -> profile settings -> renderLogicalCanvas()
   (integer logical pixels, 1 unit = 1 pixel) -> magnify() (nearest-neighbor)
   -> renderValorantCrosshair() blits into any <canvas> in the app.
   This is the ONE renderer used by every card, gallery tile, detail page,
   Add Crosshair preview, Generator preview and the dev test suite.
   ========================================================================== */

// ---- tokenizer / block parser -------------------------------------------
const PROFILE_KEYS=new Set(["P","A","S"]);
function tokenize(raw){
  return String(raw||"").trim().replace(/\s+/g,"").split(";").filter((tok,i)=>tok!==""||i===0);
}
function parseValorantCode(code){
  const raw=String(code||"").trim();
  if(!raw)return{valid:false,error:"Please enter a crosshair code."};
  const t=tokenize(raw);
  if(t[0]!=="0")return{valid:false,error:"Invalid Valorant crosshair code. Code must start with 0;."};
  const global={},profiles={P:{},A:{},S:{}};
  let block=null,i=1;
  while(i<t.length){
    const k=t[i];
    if(k===undefined||k===""){i++;continue}
    if(PROFILE_KEYS.has(k)){block=k;i++;continue}
    // Any other token is treated as key;value. Unknown/future keys are
    // stored here but simply never read by the renderer below, so
    // nothing crashes on unrecognized parameters.
    const val=(i+1<t.length)?t[i+1]:"";
    if(block)profiles[block][k]=val;else global[k]=val;
    i+=2;
  }
  if(!profiles.P||Object.keys(profiles.P).length===0)return{valid:false,error:"Invalid Valorant crosshair code. Primary profile (P) is missing."};
  return{valid:true,raw,global,profiles};
}

// ---- value helpers ---------------------------------------------------
function num(v,d){const x=Number(v);return Number.isFinite(x)?x:d}
function bool(v,d=false){return v===undefined||v===null||v===""?d:String(v)==="1"}
function clamp(v,a,c){return Math.max(a,Math.min(c,v))}
function rgba(hex,a){let h=String(hex).replace('#','');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),bl=parseInt(h.slice(4,6),16);return`rgba(${r},${g},${bl},${clamp(a,0,1)})`}
function colorFromProfile(P,G){
  const c=num(P.c??G.c,0);
  if(c===8){
    const u=P.u??G.u;
    if(u){const h=String(u).replace(/^#/,'');if(/^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(h))return'#'+h.slice(0,6)}
  }
  return palette[c]||palette[0];
}

// ---- code -> logical settings (raw game units, NOT css %) ------------
// Every length/thickness/offset value below is a *logical pixel* count.
// A crosshair with 0l=2/0t=1/0o=0 stays a 2px line, no matter how big the
// preview box is — that is the whole point of this rewrite.
function buildSettings(P,G){
  const innerLinked=P["0g"]===undefined?true:bool(P["0g"],true);
  const outerLinked=P["1g"]===undefined?true:bool(P["1g"],true);
  const il=Math.max(0,num(P["0l"],6));
  const iv=innerLinked?il:Math.max(0,num(P["0v"],il));
  const ol=Math.max(0,num(P["1l"],2));
  const ov=outerLinked?ol:Math.max(0,num(P["1v"],ol));
  return{
    color:colorFromProfile(P,G),
    outline:{on:bool(P.h??G.h,true),opacity:clamp(num(P.o??G.o,.5),0,1),thickness:Math.max(0,num(P.t??G.t,1))},
    dot:{on:bool(P.d??G.d,false),opacity:clamp(num(P.a??G.a,1),0,1),thickness:Math.max(0,num(P.z??G.z,2))},
    inner:{show:bool(P["0b"],true),opacity:clamp(num(P["0a"],.8),0,1),h:il,v:iv,thickness:Math.max(0,num(P["0t"],2)),offset:Math.max(0,num(P["0o"],3)),movement:bool(P["0m"],false),firing:bool(P["0f"],false),movementMult:num(P["0s"],1),firingMult:num(P["0e"],1)},
    outer:{show:bool(P["1b"],true),opacity:clamp(num(P["1a"],.35),0,1),h:ol,v:ov,thickness:Math.max(0,num(P["1t"],2)),offset:Math.max(0,num(P["1o"],10)),movement:bool(P["1m"],false),firing:bool(P["1f"],false),movementMult:num(P["1s"],1),firingMult:num(P["1e"],1)},
    fade:bool(P.f??G.f,false),overrideFiring:bool(P.m??G.m,false)
  };
}

// ---- static / movement / firing state ---------------------------------
// Default preview state is always "static" (resting crosshair). The
// documented Valorant firing-error gap only applies when a profile's own
// 0f/1f flag is enabled AND the caller explicitly asks for the "firing"
// state — it is never blindly added to every crosshair.
const FIRING_ERROR_GAP=4;
function applyState(settings,state){
  if(state!=='firing'&&state!=='movement')return settings;
  const s=JSON.parse(JSON.stringify(settings));
  if(state==='firing'){
    if(s.inner.firing)s.inner.offset+=FIRING_ERROR_GAP*(s.inner.firingMult||1);
    if(s.outer.firing)s.outer.offset+=FIRING_ERROR_GAP*(s.outer.firingMult||1);
  }else if(state==='movement'){
    if(s.inner.movement)s.inner.offset+=Math.round(2*(s.inner.movementMult||1));
    if(s.outer.movement)s.outer.offset+=Math.round(2*(s.outer.movementMult||1));
  }
  return s;
}

// ---- logical pixel renderer --------------------------------------------
// Draws every element as integer-aligned fillRect() calls (no stroke(),
// no fractional scaling, no antialiasing) directly onto an offscreen
// canvas sized in real logical pixels, with a small transparent margin.
function computeHalfExtent(s){
  const innerMax=s.inner.show?s.inner.offset+Math.max(s.inner.h,s.inner.v)+s.inner.thickness:0;
  const outerMax=s.outer.show?s.outer.offset+Math.max(s.outer.h,s.outer.v)+s.outer.thickness:0;
  const dotMax=s.dot.on?Math.ceil(s.dot.thickness/2):0;
  const outlinePad=(s.outline.on&&s.outline.opacity>0)?Math.ceil(s.outline.thickness):0;
  return Math.max(2,innerMax,outerMax,dotMax)+outlinePad;
}
function renderLogicalCanvas(s){
  const half=Math.ceil(computeHalfExtent(s))+2; // small transparent margin
  const size=half*2+1; // odd so there is a true single center pixel
  const cv=document.createElement('canvas');
  cv.width=size;cv.height=size;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const cx=half,cy=half;
  function pixelRect(x0,y0,w,h,fill){
    if(w<=0||h<=0)return;
    ctx.fillStyle=fill;
    ctx.fillRect(Math.round(x0),Math.round(y0),Math.round(w),Math.round(h));
  }
  function withOutline(x0,y0,w,h,color,opacity){
    if(w<=0||h<=0||opacity<=0)return;
    if(s.outline.on&&s.outline.opacity>0&&s.outline.thickness>0){
      const ot=Math.max(1,Math.round(s.outline.thickness));
      pixelRect(x0-ot,y0-ot,w+ot*2,h+ot*2,rgba('#000000',s.outline.opacity));
    }
    pixelRect(x0,y0,w,h,rgba(color,opacity));
  }
  function arms(g){
    if(!g.show||g.opacity<=0)return;
    const th=Math.max(0,Math.round(g.thickness));
    if(th<=0)return;
    const off=Math.round(g.offset),hLen=Math.round(g.h),vLen=Math.round(g.v);
    const halfTh=Math.floor(th/2);
    if(hLen>0){
      withOutline(cx+off,cy-halfTh,hLen,th,s.color,g.opacity);       // right arm
      withOutline(cx-off-hLen,cy-halfTh,hLen,th,s.color,g.opacity);  // left arm
    }
    if(vLen>0){
      withOutline(cx-halfTh,cy+off,th,vLen,s.color,g.opacity);       // bottom arm
      withOutline(cx-halfTh,cy-off-vLen,th,vLen,s.color,g.opacity);  // top arm
    }
  }
  arms(s.inner);
  arms(s.outer);
  if(s.dot.on&&s.dot.thickness>0&&s.dot.opacity>0){
    const dz=Math.max(1,Math.round(s.dot.thickness));
    const halfDz=Math.floor(dz/2);
    withOutline(cx-halfDz,cy-halfDz,dz,dz,s.color,s.dot.opacity);
  }
  return cv;
}

// ---- nearest-neighbor magnifier -----------------------------------------
// Re-scales the EXACT same raster produced above — never recomputed —
// so the 1:1 and magnified previews are always the same shape.
function magnifyCrosshair(logicalCanvas,scale){
  const cv=document.createElement('canvas');
  cv.width=logicalCanvas.width*scale;cv.height=logicalCanvas.height*scale;
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(logicalCanvas,0,0,cv.width,cv.height);
  return cv;
}

// ---- single central renderer used everywhere in AimVault -----------------
// options: {profileKey:'P'|'A'|'S', mode:'1:1'|'magnified', scale:8, state:'static'|'movement'|'firing'}
function renderValorantCrosshair(code,targetCanvas,options={}){
  if(!targetCanvas)return{valid:false,error:"No canvas."};
  const r=targetCanvas.getBoundingClientRect();
  const W=Math.max(1,Math.round(r.width)),H=Math.max(1,Math.round(r.height));
  const dpr=Math.max(1,window.devicePixelRatio||1);
  targetCanvas.width=Math.round(W*dpr);targetCanvas.height=Math.round(H*dpr);
  targetCanvas.style.width=W+'px';targetCanvas.style.height=H+'px';
  const ctx=targetCanvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);

  const parsed=parseValorantCode(code);
  if(!parsed.valid)return{valid:false,error:parsed.error};
  const profileKey=options.profileKey||'P';
  const P=(parsed.profiles[profileKey]&&Object.keys(parsed.profiles[profileKey]).length)?parsed.profiles[profileKey]:parsed.profiles.P;
  const settings=applyState(buildSettings(P,parsed.global),options.state||'static');
  const logical=renderLogicalCanvas(settings);

  const mode=options.mode||'magnified';
  const source=mode==='1:1'?logical:magnifyCrosshair(logical,Math.max(1,Math.round(options.scale||8)));

  // Centered, never stretched — the crosshair keeps its true logical
  // proportions and simply sits (possibly small) in the middle of the box.
  const dx=Math.round((W-source.width)/2),dy=Math.round((H-source.height)/2);
  ctx.drawImage(source,dx,dy,source.width,source.height);
  return{valid:true,settings,logicalSize:logical.width,renderedSize:source.width};
}

// ---- validation wrapper kept for Add Crosshair / Generator forms --------
function parseCode(code){
  const parsed=parseValorantCode(code);
  if(!parsed.valid)return{valid:false,error:parsed.error};
  return{valid:true,raw:parsed.raw};
}

// ---- DOM preview lifecycle (unchanged call signature: preview(code,cls)) -
const __avRendered=new Map();
let __avPending=[];
let __avId=0;
function preview(code,cls="preview",opts={}){
  const id='cx'+(++__avId);
  const item={id,code,mode:opts.mode||'magnified',scale:opts.scale||8,state:opts.state||'static',profileKey:opts.profileKey||'P'};
  __avPending.push(item);
  return`<div class="${cls}"><canvas id="${id}" aria-label="Valorant crosshair preview"></canvas></div>`;
}
function flushPreviews(){
  const batch=__avPending;__avPending=[];if(!batch.length)return;
  requestAnimationFrame(()=>{
    for(const item of batch){
      const c=document.getElementById(item.id);
      if(!c)continue;
      __avRendered.set(item.id,item);
      renderValorantCrosshair(item.code,c,item);
    }
  });
}
addEventListener('resize',()=>requestAnimationFrame(()=>{
  for(const[id,item]of __avRendered){
    const c=document.getElementById(id);
    if(c)renderValorantCrosshair(item.code,c,item);else __avRendered.delete(id);
  }
}));

function getData(){let x=localStorage.getItem("aimvault-data");return x?JSON.parse(x):seed}
async function all(){if(sb){let q=await sb.from("crosshairs").select("*").order("created_at",{ascending:false});if(!q.error)return q.data}return getData()}
async function save(x){localStorage.setItem("aimvault-data",JSON.stringify(x))}
async function add(item){if(sb){let q=await sb.from("crosshairs").insert(item).select().single();if(q.error)throw q.error;return q.data}let x=await all(),n={...item,id:"local-"+Date.now(),copies:0,created_at:new Date().toISOString()};x.unshift(n);await save(x);return n}
async function copyCount(id){if(sb){await sb.rpc("increment_copy_count",{crosshair_id:id});return}let x=await all(),i=x.findIndex(a=>a.id==id);if(i>=0){x[i].copies=(x[i].copies||0)+1;await save(x)}}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1700)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":n}
function card(x){return`<article class="card" onclick="location.hash='#/crosshair/${encodeURIComponent(x.id)}'">${preview(x.code)}<h3>${esc(x.name)}</h3><span class="badge ${x.type==="community"?"community":""}">${x.type}</span><div class="meta"><span>${esc(x.creator)}</span><span>${fmt(x.copies||0)} copies</span></div></article>`}
function home(x){let top=[...x].filter(a=>a.type==="curated").sort((a,b)=>(b.copies||0)-(a.copies||0)).slice(0,3),recent=[...x].filter(a=>a.type==="community").sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,6);return`<div class="hero"><div><div class="eyebrow">DISCOVER</div><h1>Find your next Valorant crosshair</h1><p class="muted">Explore pro setups, curated AimVault codes and community creations.</p></div><div class="actions"><a class="btn" href="#/crosshairs">Explore</a><a class="btn primary" href="#/add">+ Add Crosshair</a></div></div>
<div class="toolbar"><button class="active">All</button><button>Teams</button><button>Fun</button><button>Other</button><span class="grow"></span><input id="hs" placeholder="Search..."><button onclick="location.hash='#/crosshairs'">Search</button></div>
<section class="section"><div class="eyebrow">POPULAR</div><h2>Most Copied</h2><div class="features">${top.map((a,i)=>`<article class="feature" onclick="location.hash='#/crosshair/${a.id}'">${preview(a.code)}<div><span class="badge">#${i+1}</span><h3>${esc(a.name)}</h3><p class="muted">${fmt(a.copies)} copies</p><button class="btn primary">Get crosshair</button></div></article>`).join("")}</div></section>
<section class="section"><div class="eyebrow">FRESH CODES</div><h2>Recently Added</h2><div class="grid">${recent.length?recent.map(card).join(""):'<div class="empty">No community submissions yet.</div>'}</div></section>
<section class="section"><div class="eyebrow">DATABASE</div><h2>All Crosshairs</h2><div class="grid">${x.slice(0,6).map(card).join("")}</div></section>`}
async function list(){let data=await all();app.innerHTML=`<div class="hero"><div><div class="eyebrow">DATABASE</div><h1>All Crosshairs</h1><p class="muted">Curated and community Valorant crosshairs.</p></div><a class="btn primary" href="#/add">+ Add Crosshair</a></div><div class="toolbar"><button class="active filter" data-v="all">All</button><button class="filter" data-v="curated">Curated</button><button class="filter" data-v="community">Community</button><span class="grow"></span><input id="q" placeholder="Search..."><select id="sort"><option value="recent">Recently Added</option><option value="copies">Most Copied</option><option value="az">A-Z</option></select></div><div id="results" class="grid"></div><div id="pages" class="pagination"></div>`;let type="all",q="",sort="recent",page=1;function render(){let a=data.filter(x=>(type==="all"||x.type===type)&&(!q||`${x.name} ${x.creator}`.toLowerCase().includes(q.toLowerCase())));if(sort==="copies")a.sort((u,v)=>(v.copies||0)-(u.copies||0));else if(sort==="az")a.sort((u,v)=>u.name.localeCompare(v.name));else a.sort((u,v)=>new Date(v.created_at)-new Date(u.created_at));let pages=Math.max(1,Math.ceil(a.length/18));page=Math.min(page,pages);document.getElementById("results").innerHTML=a.slice((page-1)*18,page*18).map(card).join("")||'<div class="empty">No crosshairs found.</div>';document.getElementById("pages").innerHTML=Array.from({length:pages},(_,i)=>`<button class="${i+1===page?'active':''}" onclick="this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('active'));this.classList.add('active');window._avPage(${i+1})">${i+1}</button>`).join("");window._avPage=n=>{page=n;render()};flushPreviews()}document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.v;page=1;render()});qEl=document.getElementById("q");qEl.oninput=e=>{q=e.target.value;page=1;render()};document.getElementById("sort").onchange=e=>{sort=e.target.value;page=1;render()};render()}
async function detail(id){let x=(await all()).find(a=>String(a.id)===String(id));if(!x){app.innerHTML='<div class="empty">Crosshair not found.</div>';return}app.innerHTML=`<p class="muted"><a href="#/crosshairs">← All crosshairs</a></p><div class="hero"><div><div class="eyebrow">${x.type==="community"?"COMMUNITY CROSSHAIR":"AIMVAULT CROSSHAIR"}</div><h1>${esc(x.name)}</h1><p class="muted">Submitted by <b>${esc(x.creator)}</b> · ${fmt(x.copies||0)} copies</p></div></div><div class="detail"><section class="panel"><div style="display:flex;gap:6px;margin-bottom:10px"><button class="btn active" id="pvMag">Magnified</button><button class="btn" id="pv11">1:1 Actual Size</button></div><div class="preview large"><canvas id="mainPreviewCanvas" aria-label="Valorant crosshair preview"></canvas></div><div class="gallery">${preview(x.code,"preview")} ${preview(x.code,"preview light")} ${preview(x.code,"preview green")}</div></section><aside class="panel"><span class="badge ${x.type==="community"?"community":""}">${x.type}</span><p class="muted">CROSSHAIR CODE</p><div class="code">${esc(x.code)}</div><button class="btn primary" style="width:100%" id="copy">⧉ Copy Code</button><p class="muted" style="font-size:12px;margin-top:18px">The original Valorant code is the source of truth. The preview is rendered from the parsed code — 1:1 shows the real logical pixel size, Magnified enlarges the same pixels for readability.</p></aside></div>`;document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(x.code);await copyCount(x.id);toast("Crosshair code copied")};function renderMain(mode){renderValorantCrosshair(x.code,document.getElementById("mainPreviewCanvas"),{mode,scale:8})}requestAnimationFrame(()=>renderMain("magnified"));document.getElementById("pvMag").onclick=()=>{renderMain("magnified");pvMag.classList.add("active");pv11.classList.remove("active")};document.getElementById("pv11").onclick=()=>{renderMain("1:1");pv11.classList.add("active");pvMag.classList.remove("active")};flushPreviews()}
function addPage(){app.innerHTML=`<div class="hero"><div><div class="eyebrow">COMMUNITY</div><h1>Add your crosshair</h1><p class="muted">Submit a code. It appears in Recently Added as a community submission.</p></div></div><div class="form-layout"><form class="panel" id="af"><div class="form"><div class="field"><label>Name</label><input id="name" required placeholder="My Clean Dot"></div><div class="field"><label>Creator</label><input id="creator" required placeholder="Your username"></div><div class="field full"><label>Valorant crosshair code</label><textarea id="code" required placeholder="0;P;c;..."></textarea></div><div class="field"><label>Category</label><select id="cat"><option>Other</option><option>Dot</option><option>Cross</option><option>Circle</option><option>Pro Players</option><option>Fun</option></select></div><div class="field"><label>Description</label><input id="desc" placeholder="Optional"></div><div class="field full"><div id="valid" class="validation">Enter a code to preview it.</div></div><div class="field full"><button class="btn primary">Submit Crosshair</button></div></div></form><aside class="panel"><div class="eyebrow">LIVE PREVIEW</div><h3 id="pn">Your Crosshair</h3><div id="pv">${preview("0;P;c;1;o;0;0t;1;0l;2;0o;0;0a;1;0f;0;1b;0","preview large")}</div></aside></div>`;flushPreviews();let ce=document.getElementById("code");function update(){let p=parseCode(ce.value),v=document.getElementById("valid");if(!ce.value){v.textContent="Enter a code to preview it.";v.className="validation";return}v.textContent=p.valid?"✓ Valid Valorant crosshair":"✕ "+p.error;v.className=p.valid?"validation":"validation bad";if(p.valid){document.getElementById("pv").innerHTML=preview(ce.value,"preview large");flushPreviews()}}ce.oninput=update;document.getElementById("name").oninput=e=>document.getElementById("pn").textContent=e.target.value||"Your Crosshair";document.getElementById("af").onsubmit=async e=>{e.preventDefault();let p=parseCode(ce.value);if(!p.valid){update();return}try{let n=await add({name:document.getElementById("name").value,creator:document.getElementById("creator").value,code:ce.value.trim(),category:document.getElementById("cat").value,description:document.getElementById("desc").value,type:"community",approved:true});toast("Submitted!");location.hash="#/crosshair/"+n.id}catch(err){toast("Save failed — check Supabase settings")}}}
function generator(){let code="0;P;c;1;o;0;0t;1;0l;2;0o;0;0a;1;0f;0;1b;0";app.innerHTML=`<div class="hero"><div><div class="eyebrow">BUILDER</div><h1>Crosshair Generator</h1><p class="muted">Edit a code and preview it live.</p></div></div><div class="form-layout"><section class="panel"><div class="form"><div class="field full"><label>Valorant code</label><textarea id="gc">${code}</textarea></div><div class="field"><label>Color</label><select id="col"><option value="0">White</option><option value="1">Green</option><option value="2">Yellow-Green</option><option value="3">Green-Yellow</option><option value="4">Yellow</option><option value="5">Cyan</option><option value="6">Pink</option><option value="7">Red</option></select></div><div class="field"><label>Inner length</label><input id="len" type="number" value="2"></div><div class="field"><label>Inner thickness</label><input id="th" type="number" value="1"></div><div class="field"><label>Inner offset</label><input id="off" type="number" value="0"></div><div class="field"><label>Center dot</label><select id="dot"><option value="0">Off</option><option value="1">On</option></select></div><div class="field full"><button class="btn primary" id="apply">Apply settings</button> <button class="btn" id="gcCopy">Copy Code</button></div></div></section><aside class="panel"><div class="eyebrow">LIVE PREVIEW</div><div id="gp">${preview(code,"preview large")}</div></aside></div>`;flushPreviews();document.getElementById("gc").oninput=e=>{let p=parseCode(e.target.value),v=document.getElementById("gp");if(p.valid){v.innerHTML=preview(e.target.value,"preview large");flushPreviews()}};document.getElementById("apply").onclick=()=>{code=`0;P;c;${col.value};h;0;d;${dot.value};z;2;0b;1;0t;${th.value};0l;${len.value};0g;1;0o;${off.value};0a;1;0f;0;1b;0`;document.getElementById("gc").value=code;document.getElementById("gp").innerHTML=preview(code,"preview large");flushPreviews()};document.getElementById("gcCopy").onclick=()=>navigator.clipboard.writeText(document.getElementById("gc").value).then(()=>toast("Code copied"))}
function tools(){app.innerHTML=`<div class="hero"><div><div class="eyebrow">TOOLS</div><h1>AimVault Tools</h1></div></div><div class="features"><div class="panel"><h3>Crosshair Generator</h3><p class="muted">Build a crosshair with a live preview.</p><a class="btn primary" href="#/generator">Open</a></div><div class="panel"><h3>Random Crosshair</h3><p class="muted">Jump to a random AimVault code.</p><button class="btn primary" onclick="random()">Randomize</button></div><div class="panel"><h3>Renderer Test Suite</h3><p class="muted">Verify the pixel-based crosshair renderer against known test codes.</p><a class="btn primary" href="#/devtest">Open</a></div><div class="panel"><h3>Coming Soon</h3><p class="muted">More aim tools will be added here.</p></div></div>`}

// ---- developer test suite -------------------------------------------
// Critical test cases for the pixel renderer rewrite. Each entry shows
// CODE / DECODED VALUES / 1:1 PREVIEW / 4x MAGNIFIED PREVIEW side by side,
// as required for visual validation of the parser + renderer.
const DEV_TESTS=[
{name:"Test 1 — tiny inner cross (l=2,t=1,o=0)",code:"0;P;c;1;h;0;d;0;0t;1;0l;2;0o;0;0a;1;0f;0;1b;0"},
{name:"Test 2 — Sniper flag + thick cyan inner",code:"0;s;1;P;c;5;o;0;0t;4;0l;2;0o;0;0a;1;0f;0;1b;0"},
{name:"Test 3 — asymmetric inner (0l=2 short, 0v=8 long)",code:"0;P;c;1;h;0;0b;1;0g;0;0t;1;0l;2;0v;8;0o;2;0a;1;1b;0"},
{name:"Test 4 — outer lines (1l/1v/1t/1o), asymmetric",code:"0;P;c;1;h;0;0b;0;1b;1;1g;0;1l;6;1v;2;1t;2;1o;4;1a;.6"},
{name:"Test 5 — center dot only",code:"0;P;c;4;h;0;0b;0;1b;0;d;1;z;3;a;1"},
{name:"Test 6 — outline enabled",code:"0;P;c;0;h;1;o;.9;t;2;0b;1;0t;2;0l;5;0o;2;0a;1;1b;0"},
{name:"Test 7 — firing error enabled on inner",code:"0;P;c;7;h;0;0b;1;0t;2;0l;3;0o;2;0a;1;0f;1;0e;1;1b;0"},
{name:"Test 8 — custom color (c;8 + u)",code:"0;P;c;8;u;FF8800;h;0;0b;1;0t;2;0l;4;0o;1;0a;1;1b;0"}
];
function renderDevTests(state){
  document.querySelectorAll('[data-devtest]').forEach(wrap=>{
    const code=wrap.dataset.code;
    const c1=wrap.querySelector('.dt-11'),c2=wrap.querySelector('.dt-mag');
    if(c1)renderValorantCrosshair(code,c1,{mode:'1:1',state});
    if(c2)renderValorantCrosshair(code,c2,{mode:'magnified',scale:4,state});
  });
}
function devtest(){
  app.innerHTML=`<div class="hero"><div><div class="eyebrow">DEVELOPER</div><h1>Renderer Test Suite</h1><p class="muted">Validates the logical-pixel Valorant crosshair renderer against the required test cases. 1:1 shows the true raster; 4× Magnified is the exact same raster enlarged with nearest-neighbor scaling — same shape, bigger pixels.</p></div></div>
<div class="toolbar"><span class="muted" style="align-self:center">Preview state:</span><select id="dtState" style="height:38px"><option value="static">Static</option><option value="movement">Movement</option><option value="firing">Firing</option></select></div>
<div id="devtests"></div>`;
  const host=document.getElementById('devtests');
  host.innerHTML=DEV_TESTS.map((t,i)=>{
    const parsed=parseValorantCode(t.code);
    const settings=parsed.valid?buildSettings(parsed.profiles.P,parsed.global):null;
    const decoded=settings?esc(JSON.stringify(settings,null,2)):esc(parsed.error||"Invalid code");
    return`<section class="panel" style="margin-bottom:16px;padding:18px" data-devtest data-code="${esc(t.code)}">
<h3 style="margin-top:0">${esc(t.name)}</h3>
<div class="code">${esc(t.code)}</div>
<details><summary class="muted" style="cursor:pointer">Decoded values</summary><pre style="white-space:pre-wrap;font:11px ui-monospace,monospace;color:#b8c5d8;background:#0d1727;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px">${decoded}</pre></details>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
<div><p class="muted" style="font-size:11px;margin:0 0 6px">1:1 ACTUAL SIZE</p><div class="preview" style="height:120px"><canvas class="dt-11" aria-label="1:1 preview"></canvas></div></div>
<div><p class="muted" style="font-size:11px;margin:0 0 6px">4× MAGNIFIED (same raster)</p><div class="preview" style="height:120px"><canvas class="dt-mag" aria-label="4x preview"></canvas></div></div>
</div></section>`;
  }).join('');
  requestAnimationFrame(()=>renderDevTests('static'));
  document.getElementById('dtState').onchange=e=>renderDevTests(e.target.value);
}
function sensitivity(){app.innerHTML=`<div class="hero"><div><div class="eyebrow">TOOL</div><h1>Sensitivity Converter</h1><p class="muted">Approximate Valorant → CS2 starting conversion.</p></div></div><div class="panel" style="max-width:600px"><div class="field"><label>Valorant sensitivity</label><input id="s" type="number" value=".5" step=".001"></div><p>CS2 ≈ <b id="so">1.575</b></p></div>`;s.oninput=e=>so.textContent=(+e.target.value*3.15).toFixed(3)}
async function random(){let x=await all();location.hash="#/crosshair/"+x[Math.floor(Math.random()*x.length)].id}
async function route(){let p=(location.hash||"#/").slice(2).split("?")[0],id=p.split("/")[1];if(!p){app.innerHTML=home(await all());flushPreviews()}else if(p==="crosshairs")await list();else if(p==="add")addPage();else if(p==="generator")generator();else if(p==="tools")tools();else if(p==="devtest")devtest();else if(p==="sensitivity")sensitivity();else if(p.startsWith("crosshair/"))await detail(decodeURIComponent(id));else app.innerHTML='<div class="empty">Page not found.</div>'}
addEventListener("hashchange",route);route();
</script></body></html>
