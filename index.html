<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AimVault — Valorant Crosshair Library</title>
<meta name="description" content="AimVault Valorant crosshair library — find, copy and import crosshair codes used by players.">
<style>
:root{--bg:#03080f;--card:#08131e;--border:#1c3041;--text:#f4f7fa;--muted:#8da0b2;--red:#ed2636;--green:#52d6c7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}.nav{height:68px;border-bottom:1px solid #182633;display:flex;align-items:center;padding:0 max(20px,calc((100% - 1310px)/2));background:#03070d}.brand{display:flex;align-items:center;gap:10px;min-width:390px;text-decoration:none;color:inherit}.logo{width:36px;height:36px;border-radius:5px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}.brand-name{font-size:23px;font-weight:800}.brand-name span{color:var(--red)}.brand-sub{font-size:8px;letter-spacing:.8px;color:#aab5c0;margin-top:3px}.navlinks{display:flex;height:68px;gap:3px}.navlinks a{position:relative;padding:0 20px;display:flex;align-items:center;font-size:12px;font-weight:700;color:#e9edf1;text-decoration:none}.navlinks a.active{color:var(--red)}.navlinks a.active:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--red)}.submit{margin-left:auto;background:var(--red);border:0;color:white;padding:11px 17px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer}.submit:hover{background:#ff3344}.hero{text-align:center;padding:20px 20px 21px}.hero h1{margin:0;font-size:29px;font-weight:900;text-transform:uppercase}.hero p{margin:7px 0 18px;font-size:12px;color:#d3dae1}.search{width:min(565px,100%);height:38px;margin:auto;display:flex;align-items:center;border:1px solid #24384a;border-radius:5px;background:#0a141f}.search-icon{padding:0 12px;color:#9bacbd;font-size:18px}.search input{flex:1;height:100%;background:transparent;border:0;outline:0;color:white;font-size:12px}.search input::placeholder{color:#7e92a5}.filters{display:flex;justify-content:center;gap:9px;margin-top:13px;flex-wrap:wrap}.filter{border:1px solid #203548;background:#07111b;color:#eef2f5;padding:8px 17px;border-radius:5px;font-size:11px;font-weight:800;cursor:pointer}.filter.active,.filter:hover{background:var(--red);border-color:var(--red)}.container{width:min(1310px,calc(100% - 30px));margin:auto;padding-bottom:28px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,#0a1622,#07111b);border:1px solid #1d3243;border-radius:6px;padding:9px;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.card-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{font-size:18px;line-height:1;color:#ff3444;background:none;border:0;padding:0;cursor:pointer}.preview{width:100%;aspect-ratio:1.72/1;border-radius:3px;overflow:hidden;border:1px solid #293b4a;background:#b6b1a7 center/cover no-repeat}.preview img{display:block;width:100%;height:100%;object-fit:cover}.code{margin-top:7px;height:26px;padding:5px 7px;border:1px solid #1d3243;border-radius:3px;background:#06101a;color:#dbe4eb;font-family:monospace;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:1fr 37px;gap:7px;margin-top:7px}.copy,.open{height:27px;border:1px solid #21384a;background:#06111c;color:#f0f3f6;border-radius:4px;font-size:10px;font-weight:800;cursor:pointer}.copy:hover,.open:hover{border-color:#3b5265;background:#0a1723}.copy.copied{color:var(--green);border-color:#2b665e}.meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:9px;font-weight:800}.category{color:var(--red)}.copies{color:#d5dde4}.heart{color:#8798a8;margin-right:3px}.empty{display:none;text-align:center;padding:50px;color:#8395a6;border:1px solid var(--border);border-radius:7px}@media(max-width:1100px){.brand{min-width:250px}.navlinks a{padding:0 10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.nav{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 14px}.brand{width:100%}.navlinks{height:42px;width:100%;overflow:auto}.navlinks a{padding:0 12px}.submit{display:none}.hero h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:470px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="nav"><a class="brand" href="#"><div class="logo">A</div><div><div class="brand-name">Aim<span>Vault</span></div><div class="brand-sub">VALORANT CROSSHAIR LIBRARY</div></div></a><nav class="navlinks"><a class="active" href="#">Home</a><a href="#crosshairs">Crosshairs</a><a href="#categories">Categories⌄</a><a href="#players">Players</a><a href="#contact">Contact</a></nav><button class="submit">Submit Crosshair</button></header>
<section class="hero"><h1>VALORANT CROSSHAIR LIBRARY</h1><p>Find, copy, and import the best crosshair codes used by pros and players.</p><div class="search"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Search for crosshairs (e.g. TenZ, dot, small...)"></div><div class="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Pro Players">Pro Players</button><button class="filter" data-filter="Small">Small</button><button class="filter" data-filter="Dot">Dot</button><button class="filter" data-filter="Cross">Cross</button><button class="filter" data-filter="Outlined">Outlined</button><button class="filter" data-filter="Dynamic">Dynamic</button></div></section>
<main class="container" id="crosshairs"><div class="grid" id="grid"></div><div class="empty" id="empty">No crosshairs found.</div></main>
<script>
const BACKGROUND_IMAGE="YOUR-BACKGROUND-IMAGE-URL-HERE";
const CROSSHAIRS=[
{title:"TenZ Crosshair",category:"Pro Players",tags:["Pro Players","Cross"],image:"https://cdn.phototourl.com/free/2026-08-31-8beddda9-408d-4ff3-b5d0-b315f5d99cf5.png",code:"0;P;c;5;h;0;f;0;0t;1;0l;3;0o;0;0a;1;0f;0;1t;3;1o;0;1a;1;1m;0;1f;0",copies:0},
{title:"Demon1 Crosshair",category:"Pro Players",tags:["Pro Players","Cross"],image:"YOUR-DEMON1-IMAGE-URL-HERE",code:"0;P;c;8;u;F33D86FF;o;1;d;1;b;1;m;1;0t;4;0l;1;0v;8;0g;1;0o;1;0a;1;0f;0;1t;10;1l;3;1v;0;1g;1;1o;1;1a;1;1f;0;1s;0",copies:0},
{title:"Dot Crosshair",category:"Dot",tags:["Dot"],image:"YOUR-DOT-IMAGE-URL-HERE",code:"0;P;c;5;h;0;z;1;d;1;t;0;0b;0;1b;0",copies:0},
{title:"Small Crosshair",category:"Small",tags:["Small","Cross"],image:"YOUR-SMALL-IMAGE-URL-HERE",code:"0;P;c;5;h;0;f;0;0t;1;0l;3;0o;0;0a;1;0f;0;1t;3;1o;0;1a;1",copies:0},
{title:"Red Crosshair",category:"Cross",tags:["Cross"],image:"YOUR-RED-IMAGE-URL-HERE",code:"0;P;c;7;h;0;t;1;0l;2;0o;0;0a;1;0f;0;1t;2;1o;0;1a;1",copies:0},
{title:"Yellow Crosshair",category:"Cross",tags:["Cross"],image:"YOUR-YELLOW-IMAGE-URL-HERE",code:"0;P;c;4;h;0;t;1;0l;2;0o;0;1a;1",copies:0},
{title:"Cyan Crosshair",category:"Cross",tags:["Cross"],image:"YOUR-CYAN-IMAGE-URL-HERE",code:"0;P;c;5;h;0;t;1;0l;2;0o;0;1a;1",copies:0},
{title:"Outline Crosshair",category:"Outlined",tags:["Outlined","Cross"],image:"YOUR-OUTLINE-IMAGE-URL-HERE",code:"0;P;c;5;h;1;t;2;0t;2;0l;4;0o;2;0a;1;0f;0",copies:0},
{title:"Dynamic Crosshair",category:"Dynamic",tags:["Dynamic"],image:"YOUR-DYNAMIC-IMAGE-URL-HERE",code:"0;P;c;5;d;1;0t;1;0l;3;0o;1;0a;1;0f;0",copies:0},
{title:"White Dot",category:"Dot",tags:["Dot"],image:"YOUR-WHITE-DOT-IMAGE-URL-HERE",code:"0;P;c;5;h;0;z;1;d;1;t;0;0l;0;0o;0;0a;1",copies:0}
];
const grid=document.getElementById("grid"),empty=document.getElementById("empty"),search=document.getElementById("search");let activeFilter="All";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function render(){const q=search.value.trim().toLowerCase();const list=CROSSHAIRS.filter(x=>(activeFilter==="All"||x.tags.includes(activeFilter))&&(!q||(x.title+" "+x.category+" "+x.tags.join(" ")).toLowerCase().includes(q)));grid.innerHTML="";empty.style.display=list.length?"none":"block";list.forEach(x=>{const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="card-head"><div class="card-title">${esc(x.title)}</div><button class="star">☆</button></div><div class="preview" style="background-image:url('${esc(BACKGROUND_IMAGE)}')"><img src="${esc(x.image)}" alt="${esc(x.title)} crosshair preview" onerror="this.style.display='none'"></div><div class="code" title="${esc(x.code)}">${esc(x.code)}</div><div class="actions"><button class="copy">⧉ Copy Code</button><button class="open">↗</button></div><div class="meta"><span class="category">${esc(x.category)}</span><span class="copies"><span class="heart">♡</span> <span class="copy-count">${x.copies}</span> Copies</span></div>`;
card.querySelector(".copy").onclick=async()=>{try{await navigator.clipboard.writeText(x.code)}catch(e){const t=document.createElement("textarea");t.value=x.code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}x.copies++;card.querySelector(".copy-count").textContent=x.copies;const b=card.querySelector(".copy");b.textContent="✓ Copied";b.classList.add("copied");setTimeout(()=>{b.textContent="⧉ Copy Code";b.classList.remove("copied")},1200);save()};
card.querySelector(".star").onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==="☆"?"★":"☆";card.querySelector(".open").onclick=()=>navigator.clipboard?.writeText(location.origin+location.pathname+"?code="+encodeURIComponent(x.code));grid.appendChild(card)})}
function save(){try{localStorage.setItem("aimvault-copy-counts",JSON.stringify(CROSSHAIRS.map(x=>x.copies)))}catch(e){}}function load(){try{const a=JSON.parse(localStorage.getItem("aimvault-copy-counts")||"[]");CROSSHAIRS.forEach((x,i)=>{if(Number.isFinite(a[i])&&a[i]>=0)x.copies=a[i]})}catch(e){}}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeFilter=b.dataset.filter;render()});search.oninput=render;load();render();
</script></body></html>
